<!DOCTYPE html>
<html>
<head>
  <title>Javascript</title>
  <meta charset="utf-8">
  <script>
    let width;
    let height;

    width = prompt("너비를 입력하세요.", "정수로 입력하세요")
    height = prompt("높이를 입력하세요.", "정수로 입력하세요")

    document.write("면적: ");
    area = width * height;
    document.write(area + "<br>");

    document.write("너비: ");
    round = (width + height) * 2;
    document.write(round + "<br>");

  </script>
</head>
<body>
</body>
</html>
