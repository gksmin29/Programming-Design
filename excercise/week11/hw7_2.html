<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>gugu</title>
  <script>
    function gugu(num) {
      for (let i = 1; i < 10; i++) {
        document.write(num + " * " + i + " = " + (num * i) + "</br>");
      }
    }

    document.write('<title>gugu</title>')
    let num
    while (true) {
      num = prompt('출력할 단을 입력하세요. (2 ~ 9)');
      if (!isNaN(num) && num >= 2 && num <= 9)
        break;
      else {
        alert('다시 입력하세요');
      }
    }
    gugu(num);
  </script>
</head>
