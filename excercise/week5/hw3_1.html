<html>
<head>
  <meta charset="utf-8">
  <title>지원서</title>
</head>
<body>
<h1>지원서</h1>
<p>HTML, CSS, Javascipt에 대한 경험이 있는 분을 찾습니다.</p>
<hr>
<h3><b>개인정보</b></h3>
<ul>
  <li>이름 <input type="text" name="name" value="공백 없이 입력하세요"></li>
  <li>연락처 <input type="text" name="email" value=""></li>
</ul>
<h3><b>지원 분야</b></h3>
<ul>
  <li><input type="radio" name="subject" id="publishing" value="publishing"> 웹 퍼블리싱</li>
  <li><input type="radio" name="subject" id="application" value="application"> 웹 어플리케이션</li>
  <li><input type="radio" name="subject" id="development" value="development"> 웹개발 환경 개선</li>
</ul>
<h3>지원 동기</h3>
<textarea name="message" rows="5" cols="50">본사 지원 동기를 간략히 써 주세요</textarea>
<br>
<input type="submit" value="접수하기">
<input type="reset" value="다시쓰기">
</body>
</html>
