<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>hw6_1</title>
  <style>
    #yellow {
      background-color: yellow;
      display: block;
      height: 40px;
    }
    #red {
      background-color: red;
      display: block;
      height: 80px;
    }
    #blue {
      background-color: blue;
      display: inline-block;
      height: 400px;
      width: 33%;
    }
    #green {
      background-color: green;
      display: inline-block;
      height: 400px;
      width: 33%;
    }
    #purple {
      position: relative;
      bottom: 200px;
      background-color: purple;
      display: inline-block;
      height: 200px;
      width: 33%;
    }
    #black {
      background-color: black;
      display: block;
      height: 40px;
    }
  </style>
</head>
<body>
<div id="yellow"></div>
<div id="red"></div>
<div id="entire">
  <div id="blue"></div>
  <div id="green"></div>
  <div id="purple"></div>
</div>
<div id="black"></div>
</body>
</html>
